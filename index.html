<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>CONEXION VID RADIO - CLASICOS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <meta property="og:title" content="CONEXION VID RADIO - CLASICOS">
  <meta property="og:description" content="Somos una emisora en línea dedicada a ofrecer una experiencia auditiva única, combinando música, noticias y entretenimiento en tiempo real. Nuestra programación está diseñada para mantenerte informado y entretenido, sin importar dónde te encuentres.">
  <meta property="og:image" content="https://i.postimg.cc/YCSZKhmc/logo.png">
  <meta property="og:type" content="website">
  <meta name="description" content="Somos una emisora en línea dedicada a ofrecer una experiencia auditiva única, combinando música, noticias y entretenimiento en tiempo real. Nuestra programación está diseñada para mantenerte informado y entretenido, sin importar dónde te encuentres.">

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ff4500">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="https://i.postimg.cc/YCSZKhmc/logo.png">

  <link href="https://fonts.googleapis.com/css?family=Be+Vietnam&display=swap" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.2.1.min.js"></script>
  <script src="https://extassisnetwork.com/player/Luna/luna.js"></script>
  
  <style>
    body {
      font-family: 'Be Vietnam', sans-serif;
      background: linear-gradient(180deg, #000000 0%, #434343 100%);
      background-attachment: fixed;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }

    .main-wrapper {
      width: 100%;
      max-width: 380px;
      background: #ffffff;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      position: relative;
      overflow: visible;
    }

    /* CABECERA */
    .header-station {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 15px;
      background: #fff;
      border-bottom: 1px solid #eee;
    }
    .brand-box { display: flex; align-items: center; gap: 8px; }
    .brand-box img { height: 35px; width: auto; }
    .brand-box span { font-weight: bold; color: #333; font-size: 11px; text-transform: uppercase; }

    /* BOTÓN REDES */
    .btn-redes-top {
      background: #ff4500;
      color: #fff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    /* MENÚ DESPLEGABLE */
    #menu-redes {
      display: none;
      position: absolute;
      top: 55px;
      right: 15px;
      background: #ffffff;
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
      border-radius: 12px;
      z-index: 1000;
      width: 220px;
      padding: 5px 0;
    }
    .menu-link {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 15px;
      text-decoration: none;
      color: #333;
      font-size: 12px;
      border-bottom: 1px solid #f5f5f5;
    }
    .menu-link:last-child { border: none; }
    .menu-link img { width: 20px; height: 20px; }

    /* REPRODUCTOR */
    .player-container { width: 100%; min-height: 420px; background: #fff; }
    #extassisnetwork { width: 100% !important; height: 420px !important; }

    /* ANIMACIÓN LIVE (INDICADOR ((·)) LIVE) */
    .luna-live-icon {
        color: #666666 !important; /* Gris por defecto */
        transition: color 0.5s ease;
    }
    .luna-live-icon.active {
        color: #ff0000 !important; /* Rojo cuando está activo */
        animation: blink-live 2s infinite;
    }
    @keyframes blink-live {
        0% { opacity: 1; }
        50% { opacity: 0.3; }
        100% { opacity: 1; }
    }

    /* BANNER PUBLICIDAD (TAMAÑO DUPLICADO) */
    .banner-container {
      width: 100%;
      height: 240px; 
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      border-top: 1px solid #eee;
      border-radius: 0 0 15px 15px;
    }
    .slide-banner { display: none; width: 100%; text-align: center; }
    .slide-banner img { 
      width: 90%; 
      border-radius: 8px; 
      max-height: 220px; 
      object-fit: contain; 
    }

    /* ESTILO BOTÓN PLAY */
    .luna-play-button {
      border: 4px solid #ff4500 !important;
      box-shadow: 0 0 20px rgba(255, 69, 0, 0.5) !important;
      animation: pulse-orange 2s infinite;
    }
    @keyframes pulse-orange {
      0% { transform: scale(1); }
      70% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>

<div class="main-wrapper">
  <div class="header-station">
    <div class="brand-box">
      <img src="https://i.postimg.cc/YCSZKhmc/logo.png" alt="Logo">
      <span>CONEXION VID RADIO - CLASICOS</span>
    </div>
    <div class="btn-redes-top" onclick="$('#menu-redes').fadeToggle(200)">REDES ▾</div>
    
    <div id="menu-redes">
        <a href="https://wa.me/52273" class="menu-link" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/733/733585.png"> WhatsApp</a>
        <a href="https://www.facebook.com/conexionVidRadio" class="menu-link" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/733/733547.png"> Facebook</a>
        <a href="" class="menu-link" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png"> YouTube</a>
        <a href="" class="menu-link" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/3046/3046121.png"> TikTok</a>
        <a href="" class="menu-link" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/2111/2111646.png"> Telegram</a>
        <a href="" class="menu-link" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/665/665209.png"> </a>
        <a href="" class="menu-link" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/665/665209.png"> </a>
    </div>
  </div>

  <div class="player-container">
    <div id="extassisnetwork"></div>
  </div>

  <div class="banner-container" id="banner-box"></div>
</div>

<script>
  // REGISTRO SERVICE WORKER PARA PWA
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(err => console.log('Error PWA', err));
    });
  }

  // BANNERS (18 espacios sugeridos)
  const misBanners = [
    { img: "https://i.postimg.cc/YCSZKhmc/logo.png", link: "https://www.facebook.com/conexionVidRadio" },
    { img: "https://i.postimg.cc/YCSZKhmc/logo.png", link: "https://www.facebook.com/conexionVidRadio" },
    { img: "https://i.postimg.cc/YCSZKhmc/logo.png", link: "https://www.facebook.com/conexionVidRadio" }
  ];

  function startBanners() {
    const box = $('#banner-box');
    misBanners.forEach((b, i) => {
      box.append(`<div class="slide-banner" id="b-${i}"><a href="${b.link}" target="_blank"><img src="${b.img}"></a></div>`);
    });
    let idx = 0; $(`#b-${idx}`).show();
    if(misBanners.length > 1) {
      setInterval(() => {
        $(`#b-${idx}`).fadeOut(500, function() {
          idx = (idx + 1) % misBanners.length;
          $(`#b-${idx}`).fadeIn(500);
        });
      }, 6000);
    }
  }

  $(document).ready(function() {
    $("#extassisnetwork").lunaradio({
      userinterface: "big",
      coverimage: "https://i.postimg.cc/YCSZKhmc/logo.png",
      backgroundcolor: "rgba(255,255,255,1)",
      fontcolor: "#333333",
      hightlightcolor: "#ff0000", // Color rojo para resaltar actividad
      streamurl: "http://espora.org:8000",
      streamtype: "icecast2",
      icecastid: "1",
      icecastpath: "/cvr",
      metadatatype: "icecast2",
      usestreamcorsproxy: "true",
      autoplay: false
    });

    // Activar parpadeo del icono Live al cargar
    setTimeout(function(){
       $('.luna-live-icon').addClass('active');
    }, 3000);

    startBanners();
    $(document).click(e => { if (!$(e.target).closest('.header-station').length) $("#menu-redes").fadeOut(200); });
  });
</script>
</body>
</html>
